# Keep the imported Selectel zone in .octodns/zones/imported.
# Internal address of the private host.
"*.private":
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
_dmarc.private:
  - ttl: 300
    type: TXT
    value: "v=DMARC1\\; p=quarantine\\; rua=mailto:postmaster@private.outworld66.ru"
auth.private:
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
default._domainkey.private:
  - ttl: 300
    type: TXT
    value: "v=DKIM1\\; k=rsa\\; "
files.private:
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
mail.private:
  - ttl: 300
    type: A
    value: 85.142.172.131
private:
  - ttl: 300
    type: A
    value: 192.168.0.3
  - ttl: 300
    type: MX
    value:
      exchange: mail.private.outworld66.ru.
      preference: 10
  - ttl: 300
    type: TXT
    value: v=spf1 mx ~all
stats.private:
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
