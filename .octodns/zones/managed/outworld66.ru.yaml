# Keep the imported Selectel zone in .octodns/zones/imported.
# Internal address of the private host.
"*.private":
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
auth.private:
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
files.private:
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
private:
  - ttl: 300
    type: A
    value: 192.168.0.3
  - ttl: 300
    type: MX
    value: 10 mail.private.outworld66.ru.
  - ttl: 300
    type: TXT
    value: v=spf1 mx ~all
mail.private:
  - ttl: 300
    type: A
    value: 85.142.172.131
_dmarc.private:
  - ttl: 300
    type: TXT
    value: "v=DMARC1; p=quarantine; rua=mailto:postmaster@private.outworld66.ru"
stats.private:
  - ttl: 300
    type: CNAME
    value: private.outworld66.ru.
