version: "3"

vars:
  PRIVATE_FLAKE_DIR: '{{.PRIVATE_FLAKE | default "../outworld-nixos-private"}}'
  PACKAGES_FLAKE_DIR: '{{.PACKAGES_FLAKE | default "../outworld-nixos-packages"}}'
  SERVER_HOST: '{{.SERVER_HOST | default ""}}'
  SERVER_TARGET: '{{.SERVER_TARGET | default ""}}'
  SERVER_AGE_KEY: '{{.SERVER_AGE_KEY | default "/var/lib/sops-nix/key.txt"}}'

tasks:
  update-lock:
    desc: Update flake.lock; pass input names after -- for a targeted update
    cmds:
      - nix flake update {{.CLI_ARGS}}

  fmt:
    desc: Format and autofix repository sources
    cmds:
      - |
        if test -f "{{.PACKAGES_FLAKE_DIR}}/flake.nix"; then
          nix fmt --no-write-lock-file --override-input outworld-packages "path:{{.PACKAGES_FLAKE_DIR}}"
        else
          nix fmt
        fi

  ci:
    desc: Run all local CI checks
    deps:
      - fmt
    cmds:
      - |
        if test -f "{{.PACKAGES_FLAKE_DIR}}/flake.nix"; then
          nix run --no-write-lock-file --override-input outworld-packages "path:{{.PACKAGES_FLAKE_DIR}}" .#check -- \
            --no-write-lock-file --override-input outworld-packages "path:{{.PACKAGES_FLAKE_DIR}}"
        else
          nix run .#check
        fi

  build:
    desc: Check and build the current host, with private settings when available
    deps:
      - fmt
    cmds:
      - |
        set -- --no-write-lock-file
        if test -f "{{.PACKAGES_FLAKE_DIR}}/flake.nix"; then
          set -- "$@" --override-input outworld-packages "path:{{.PACKAGES_FLAKE_DIR}}"
        fi
        if test -f "{{.PRIVATE_FLAKE_DIR}}/flake.nix"; then
          set -- "$@" --override-input private "path:{{.PRIVATE_FLAKE_DIR}}"
        fi
        nix flake check --no-build --print-build-logs "$@"
        nh os build . "$@"

  cve:
    desc: Scan NixOS closures and configured OCI images for known CVEs
    vars:
      CVE_HOST: '{{.CVE_HOST | default "all"}}'
    cmds:
      - |
        set -eu
        nix develop --no-write-lock-file \
          --override-input outworld-packages "path:{{.PACKAGES_FLAKE_DIR}}" \
          --override-input private "path:{{.PRIVATE_FLAKE_DIR}}" \
          --command bash -euc '
            requested_host="$1"
            private_dir="$2"
            packages_dir="$3"
            input_args=(--no-write-lock-file \
              --override-input outworld-packages "path:$packages_dir" \
              --override-input private "path:$private_dir")
            available_hosts="$(nix eval --json "${input_args[@]}" .#nixosConfigurations --apply builtins.attrNames | jq -r ".[]")"
            if [ "$requested_host" = all ]; then
              hosts="$available_hosts"
            else
              printf '%s\n' "$available_hosts" | grep -Fxq "$requested_host" || {
                echo "Unknown NixOS host: $requested_host" >&2
                echo "Available hosts: $available_hosts" >&2
                exit 2
              }
              hosts="$requested_host"
            fi

            status=0
            for host in $hosts; do
              echo "=== Building NixOS closure: $host ==="
              system="$(nix build --no-link --print-out-paths \
                "${input_args[@]}" ".#nixosConfigurations.$host.config.system.build.toplevel")"
              echo "=== Scanning NixOS closure: $host ==="
              if ! vulnix --closure "$system"; then
                status=1
              fi

              echo "=== Scanning OCI images: $host ==="
              images="$(nix eval --json "${input_args[@]}" \
                ".#nixosConfigurations.$host.config.virtualisation.oci-containers.containers" \
                --apply "containers: builtins.attrValues (builtins.mapAttrs (_: container: container.image) containers)")"
              while IFS= read -r image; do
                [ -n "$image" ] || continue
                echo "--- $image"
                if ! trivy image --scanners vuln --image-src remote --exit-code 1 "$image"; then
                  status=1
                fi
              done < <(printf "%s" "$images" | jq -r ".[]")
            done
            exit "$status"
          ' cve '{{.CVE_HOST}}' '{{.PRIVATE_FLAKE_DIR}}' '{{.PACKAGES_FLAKE_DIR}}'

  switch:
    desc: Activate the current host, with private settings when available
    deps:
      - fmt
    cmds:
      - |
        set -eu
        private_dir="{{.PRIVATE_FLAKE_DIR}}"
        packages_dir="{{.PACKAGES_FLAKE_DIR}}"
        for repo in . "$private_dir" "$packages_dir"; do
          test -f "$repo/flake.nix" || continue
          branch="$(git -C "$repo" branch --show-current)"
          upstream="$(git -C "$repo" rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null || true)"
          if test "$branch" != main || test "$upstream" != origin/main || test -n "$(git -C "$repo" status --porcelain --untracked-files=normal)"; then
            echo "Refusing to activate: $repo must be a clean main checkout tracking origin/main" >&2
            exit 1
          fi
        done
        set -- --no-write-lock-file
        if test -f "{{.PACKAGES_FLAKE_DIR}}/flake.nix"; then
          set -- "$@" --override-input outworld-packages "path:{{.PACKAGES_FLAKE_DIR}}"
        fi
        if test -f "{{.PRIVATE_FLAKE_DIR}}/flake.nix"; then
          set -- "$@" --override-input private "path:{{.PRIVATE_FLAKE_DIR}}"
        fi
        nh os switch . "$@"

  server-bootstrap-key:
    desc: Bootstrap a host age key (set SERVER_HOST)
    cmds:
      - |
        set -eu
        private_flake="{{.PRIVATE_FLAKE_DIR}}/flake.nix"
        packages_dir="{{.PACKAGES_FLAKE_DIR}}"
        host="{{.SERVER_HOST}}"
        target="{{.SERVER_TARGET}}"
        test -f "$private_flake"
        test -f "$packages_dir/flake.nix"
        scripts/require-main-branches . "${private_flake%/flake.nix}" "$packages_dir"
        test -n "$host"
        case "$host" in
          *[!a-zA-Z0-9_-]*) echo "Invalid host name: $host" >&2; exit 2 ;;
        esac
        for repo in . "{{.PRIVATE_FLAKE_DIR}}"; do
          branch="$(git -C "$repo" branch --show-current)"
          upstream="$(git -C "$repo" rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null || true)"
          if test "$branch" != main || test "$upstream" != origin/main || test -n "$(git -C "$repo" status --porcelain --untracked-files=normal)"; then
            echo "Refusing to activate: $repo must be a clean main checkout tracking origin/main" >&2
            exit 1
          fi
        done
        if test -z "$target"; then
          target="$(task --silent server-target -- "$host")"
        fi
        count="$(grep -F -c '{ server.secrets.bootstrap = true; }' "$private_flake" || true)"
        test "$count" = 1
        nixos-rebuild switch --flake ".#$host" \
          --target-host "$target" \
          --override-input private "path:{{.PRIVATE_FLAKE_DIR}}"
        ssh "$target" \
          /run/current-system/sw/bin/age-keygen -y "{{.SERVER_AGE_KEY}}"

  server-bootstrap-finish:
    desc: Add a host recipient and prepare SOPS settings for a main-branch deployment
    cmds:
      - |
        set -eu
        private_dir="{{.PRIVATE_FLAKE_DIR}}"
        host="{{.SERVER_HOST}}"
        target="{{.SERVER_TARGET}}"
        sops_file="$private_dir/secrets/private.yaml"
        sops_config="$private_dir/.sops.yaml"
        private_flake="$private_dir/flake.nix"
        key_file="${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"

        test -n "$host"
        case "$host" in
          *[!a-zA-Z0-9_-]*) echo "Invalid host name: $host" >&2; exit 2 ;;
        esac
        if test -z "$target"; then
          target="$(task --silent server-target -- "$host")"
        fi
        if test -z "$target"; then
          target="$(task --silent server-target -- "$host")"
        fi
        test -f "$sops_file"
        test -f "$sops_config"
        test -f "$private_flake"
        test -r "$key_file"
        for repo in . "$private_dir"; do
          branch="$(git -C "$repo" branch --show-current)"
          upstream="$(git -C "$repo" rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null || true)"
          if test "$branch" != main || test "$upstream" != origin/main || test -n "$(git -C "$repo" status --porcelain --untracked-files=normal)"; then
            echo "Refusing bootstrap changes: $repo must be a clean main checkout tracking origin/main" >&2
            exit 1
          fi
        done

        recipient="${SERVER_AGE_RECIPIENT:-$(ssh "$target" \
          /run/current-system/sw/bin/age-keygen -y "{{.SERVER_AGE_KEY}}")}"
        case "$recipient" in
          age1*) ;;
          *) echo "Invalid age recipient: $recipient" >&2; exit 1 ;;
        esac

        printf 'This will update SOPS recipients and enable server secrets. Continue? [y/N] '
        read answer
        test "$answer" = y || test "$answer" = Y

        if grep -Fq "&$host $recipient" "$sops_config"; then
          :
        elif grep -Eq "^  - &$host " "$sops_config"; then
          echo "The $host recipient already exists but does not match $recipient" >&2
          exit 1
        else
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          awk -v host="$host" -v recipient="$recipient" '
            /^  - &admin / { print; printf "  - &%s %s\n", host, recipient; next }
            /^          - \*admin$/ { print; printf "          - *%s\n", host; next }
            { print }
          ' "$sops_config" > "$tmp"
          mv "$tmp" "$sops_config"
          trap - EXIT
        fi

        if ! grep -Fq "          - *$host" "$sops_config"; then
          echo "The $host recipient is not referenced by the creation rule" >&2
          exit 1
        fi

        SOPS_AGE_KEY_FILE="$key_file" \
          nix run nixpkgs#sops -- --config "$sops_config" updatekeys --yes "$sops_file"

        count="$(grep -F -c '{ server.secrets.bootstrap = true; }' "$private_flake" || true)"
        test "$count" = 1
        sed -i 's/{ server\.secrets\.bootstrap = true; }/{ server.secrets.enable = true; }/' "$private_flake"

        nix flake check --no-build --no-write-lock-file \
          --override-input private "path:$private_dir"
        echo "Bootstrap settings are prepared on main. Commit and push the private changes, then run: task server-update -- $host"

  server-target:
    desc: Resolve the configured IPv4 SSH target for a host
    cmds:
      - |
        set -eu
        host="{{.CLI_ARGS}}"
        case "$host" in
          *[!a-zA-Z0-9_-]*|'') echo "Invalid host name: $host" >&2; exit 2 ;;
        esac
        addresses="$(nix eval --json --no-write-lock-file ".#nixosConfigurations.$host.config.networking.interfaces.eno1.ipv4.addresses")"
        address="$(printf '%s' "$addresses" | jq -er 'if length == 1 then .[0].address else error("expected exactly one eno1 IPv4 address") end')"
        printf 'root@%s\n' "$address"

  server-update:
    desc: Pull repositories, check, and deploy a selected host (use -- <host>)
    cmds:
      - |
        set -eu
        private_dir="{{.PRIVATE_FLAKE_DIR}}"
        packages_dir="{{.PACKAGES_FLAKE_DIR}}"
        host="{{.CLI_ARGS}}"
        target="{{.SERVER_TARGET}}"
        server_hosts="$(nix eval --json .#lib.serverHosts --no-write-lock-file | tr -d '[]" ' | tr ',' '\n')"

        if test -z "$host"; then
          echo "Usage: task server-update -- <host>" >&2
          echo "Available hosts:" >&2
          printf '%s\n' "$server_hosts" | sed '/^$/d; s/^/  /' >&2
          exit 2
        fi
        case "$host" in
          *[!a-zA-Z0-9_-]*) echo "Invalid host name: $host" >&2; exit 2 ;;
        esac
        printf '%s\n' "$server_hosts" | grep -Fxq "$host" || {
          echo "Unknown server host: $host" >&2
          echo "Available hosts:" >&2
          printf '%s\n' "$server_hosts" | sed '/^$/d; s/^/  /' >&2
          exit 2
        }

        test -f "$private_dir/flake.nix"
        test -f "$packages_dir/flake.nix"

        check_main_checkout() {
          repo="$1"
          name="$2"
          branch="$(git -C "$repo" branch --show-current)"
          upstream="$(git -C "$repo" rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null || true)"
          if test "$branch" != main || test "$upstream" != origin/main; then
            echo "$name must be on main tracking origin/main (found $branch tracking ${upstream:-no upstream})" >&2
            exit 1
          fi
          if test -n "$(git -C "$repo" status --porcelain --untracked-files=normal)"; then
            echo "$name has uncommitted or untracked changes; refusing to deploy" >&2
            exit 1
          fi
        }

        check_main_checkout . "outworld-nixos-configs"
        check_main_checkout "$private_dir" "outworld-nixos-private"
        check_main_checkout "$packages_dir" "outworld-nixos-packages"

        git pull --ff-only
        git -C "$private_dir" pull --ff-only
        git -C "$packages_dir" pull --ff-only

        for repo in . "$private_dir" "$packages_dir"; do
          if test "$(git -C "$repo" rev-parse HEAD)" != "$(git -C "$repo" rev-parse '@{upstream}')"; then
            echo "Refusing to deploy: $repo main is not synchronized with origin/main" >&2
            exit 1
          fi
        done

        if test -z "$target"; then
          target="$(task --silent server-target -- "$host")"
        fi

        nix flake check --no-build --no-write-lock-file \
          --override-input outworld-packages "path:$packages_dir" \
          --override-input private "path:$private_dir"
        nixos-rebuild switch --flake ".#$host" \
          --target-host "$target" \
          --override-input outworld-packages "path:$packages_dir" \
          --override-input private "path:$private_dir"

  server-list:
    desc: List hosts available for server-update
    cmds:
      - nix eval --json .#lib.serverHosts --no-write-lock-file | tr -d '[]" ' | tr ',' '\n'

  dns:
    desc: Plan and optionally apply Selectel DNS changes
    cmds:
      - |
        set -eu
        if test -z "${KEYSTONE_PROJECT_TOKEN:-}"; then
          private_secrets="{{.PRIVATE_FLAKE_DIR}}/secrets/private.yaml"
          test -f "$private_secrets"
          selectel_secret() {
            nix run nixpkgs#sops -- --decrypt --extract "$1" "$private_secrets"
          }
          selectel_user="$(selectel_secret '["selectel"]["user"]')"
          selectel_password="$(selectel_secret '["selectel"]["password"]')"
          selectel_account_id="$(selectel_secret '["selectel"]["account_id"]')"
          selectel_project_name="$(selectel_secret '["selectel"]["project_name"]')"
          token_tmp="$(mktemp -d)"
          trap 'rm -f "$token_tmp/response.json" "$token_tmp/headers.txt"; rmdir "$token_tmp"' EXIT
          export KEYSTONE_PROJECT_TOKEN="$(
            jq -n \
              --arg user "$selectel_user" \
              --arg password "$selectel_password" \
              --arg account_id "$selectel_account_id" \
              --arg project_name "$selectel_project_name" \
              '{auth:{identity:{methods:["password"],password:{user:{name:$user,domain:{name:$account_id},password:$password}}},scope:{project:{name:$project_name,domain:{name:$account_id}}}}}' \
              | curl --fail --silent --show-error \
                  -H 'Content-Type: application/json' \
                  -D - \
                  -o "$token_tmp/response.json" \
                  -X POST \
                  --data-binary @- \
                  https://cloud.api.selcloud.ru/identity/v3/auth/tokens \
              >"$token_tmp/headers.txt"
            awk 'tolower($1) == "x-subject-token:" { print $2 }' "$token_tmp/headers.txt" | tr -d '\r'
          )"
        fi

        if ! test -f .octodns/zones/imported/outworld66.ru.yaml; then
          mkdir -p .octodns/zones/imported
          uv run --locked octodns-dump \
            --config-file=.octodns/config.yaml \
            --output-dir=.octodns/zones/imported \
            --output-provider imported \
            outworld66.ru. selectel
          echo "Imported the current zone into .octodns/zones/imported/outworld66.ru.yaml"
          printf 'Review the imported file, then continue to plan? [y/N] '
          read -r imported_answer
          case "$imported_answer" in
            y|Y|yes|YES) ;;
            *) echo "DNS plan skipped."; exit 0 ;;
          esac
        fi

        force_args=""
        if test -n "${OCTODNS_FORCE:-}"; then
          force_args="--force"
        fi
        uv run --locked octodns-sync \
          --config-file=.octodns/config.yaml \
          $force_args

        printf 'Apply this DNS plan to Selectel? [y/N] '
        read -r answer
        case "$answer" in
          y|Y|yes|YES)
            uv run --locked octodns-sync \
              --config-file=.octodns/config.yaml \
              $force_args \
              --doit
            ;;
          *)
            echo "DNS sync skipped."
            ;;
        esac
