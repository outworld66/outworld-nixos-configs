name: selfhosted
is_done_tick_dot_com: false
is_user_creation_disabled: false
database:
  type: sqlite
  migration: true
storage:
  max_file_size: 10485760
jwt:
  session_time: 168h
  max_refresh: 1440h
server:
  port: 2021
  serve_frontend: true
  serve_swagger: false
  public_host: https://donetick.outworld66.ru
  cors_allow_origins:
    - https://donetick.outworld66.ru
    - http://localhost:5173
    - http://localhost:7926
    - https://localhost
    - http://localhost
    - capacitor://localhost
logging:
  level: info
  encoding: json
  development: false
oauth2:
  auth_url: https://id.outworld66.ru/authorize
  token_url: https://id.outworld66.ru/api/oidc/token
  user_info_url: https://id.outworld66.ru/api/oidc/userinfo
  redirect_url: https://donetick.outworld66.ru/auth/oauth2
  scopes:
    - openid
    - profile
    - email
    - groups
  name: Pocket ID
  admin_groups:
    - donetick-admin
disable_password_auth: true
