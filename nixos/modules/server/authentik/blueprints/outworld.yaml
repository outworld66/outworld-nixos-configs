  identifiers:
    name: LDAP directory reader
- model: authentik_core.group
  id: ldap-directory-reader-group
  identifiers:
    name: ldap-directory-reader
  attrs:
    roles:
    - !KeyOf ldap-directory-reader-role
- model: authentik_providers_ldap.ldapprovider
  id: outworld-ldap-provider
  identifiers:
    name: Outworld LDAP
  attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    base_dn: dc=outworld66,dc=ru
    bind_mode: direct
    search_mode: direct
    mfa_support: false
  permissions:
  - permission: authentik_providers_ldap.search_full_directory
    role: !KeyOf ldap-directory-reader-role
- model: authentik_providers_oauth2.scopemapping
  id: outworld-groups-scope
  identifiers:
    managed: goauthentik.io/providers/oauth2/scope-groups
  attrs:
    name: Outworld OAuth groups
    scope_name: groups
    description: Assigned authorization groups
    expression: |
      return {"groups": [group.name for group in request.user.groups.all()]}
- model: authentik_providers_oauth2.scopemapping
  id: outworld-email-scope
  identifiers:
    name: Outworld email
  attrs:
    scope_name: email
    description: Email address verified through the Outworld enrollment flow
    expression: |
      return {
          "email": request.user.email,
          "email_verified": request.user.is_active,
      }
- model: authentik_providers_oauth2.oauth2provider
  id: gotify-oidc-provider
  identifiers:
