    order: 100
- model: authentik_policies_expression.expressionpolicy
  id: outworld-invitation-policy
  identifiers:
    name: Outworld invitation email and group validation
  attrs:
    expression: |
      from authentik.core.models import Group
      import json
      import os

      invitation = request.context.get("invitation")
      submitted = str(request.context.get("prompt_data", {}).get("email", "")).strip().casefold()
      if invitation is None:
          names = json.loads(os.environ.get("AUTHENTIK_EMAIL_GROUP_MAPPINGS", "{}")).get(submitted, [])
          if not names:
              return True
      else:
          data = invitation.fixed_data or {}
          expected = str(data.get("email", "")).strip().casefold()
          names = data.get("groups")
      allowed = {
          "media-admin", "media-user", "donetick-admin", "donetick-user",
          "gotify-admin", "gotify-user", "stats-user", "mail-admin", "mail-user",
          "ai-admin", "ai-user", "stoat-admin", "stoat-user",
      }
      if invitation is not None and (not expected or expected != submitted or not isinstance(names, list) or not names):
          return False
      if any(not isinstance(name, str) or name not in allowed for name in names):
          return False

      groups = list(Group.objects.filter(name__in=set(names)))
      if len(groups) != len(set(names)):
          return False
      request.context["flow_plan"].context["groups"] = groups
      return True
- model: authentik_policies.policybinding
  identifiers:
    order: 0
    policy: !KeyOf outworld-invitation-policy
    target: !KeyOf outworld-user-write-binding
- model: authentik_policies_expression.expressionpolicy
  id: outworld-passkey-password-policy
  identifiers:
    name: Outworld password required without WebAuthn
  attrs:
    expression: |
      from authentik.stages.authenticator_webauthn.models import WebAuthnDevice

      pending_user = request.context.get("pending_user")
      if not pending_user:
          return True
      return not WebAuthnDevice.objects.filter(user=pending_user, confirmed=True).exists()
- model: authentik_flows.flowstagebinding
  id: outworld-default-password-binding
  identifiers:
    order: 20
    stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
    target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
  attrs:
    policy_engine_mode: all
    re_evaluate_policies: true
- model: authentik_policies.policybinding
  identifiers:
    order: 20
    policy: !KeyOf outworld-passkey-password-policy
    target: !KeyOf outworld-default-password-binding
  attrs:
    failure_result: true
- model: authentik_stages_identification.identificationstage
  identifiers:
    name: default-authentication-identification
  attrs:
    enrollment_flow: !KeyOf outworld-enrollment
    user_fields:
    - email
    - username
