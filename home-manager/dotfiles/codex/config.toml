model_reasoning_effort = "medium"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 15.0

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[tui]
notifications = false

[tui.model_availability_nux]
"gpt-5.6-sol" = 1

[features]
child_agents_md = true
hooks = true
goals = true

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "codex-notify-approval"
timeout = 10

[hooks.state]

[hooks.state."/home/outworld/.codex/config.toml:permission_request:0:0"]
trusted_hash = "sha256:1c717dd855090b15ab7794de4ca51e52da9323762cfa1d3db6a6673d1640347a"
enabled = true

[projects."/home/outworld/nix"]
trust_level = "trusted"

[projects."/home/outworld/blackCrusadeProject"]
trust_level = "trusted"

[projects."/home/outworld/nix/outworld-nixos-configs"]
trust_level = "trusted"

[notice]
hide_rate_limit_model_nudge = true
