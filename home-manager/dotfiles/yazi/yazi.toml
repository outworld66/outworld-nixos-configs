# toml-language-server: $schema=https://yazi-rs.github.io/schemas/yazi.json

# Default config :
# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml
# https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
show_hidden = true

[input]
cursor_blink = true

[preview]
image_delay = 0

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
