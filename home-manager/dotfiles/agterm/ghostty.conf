# agterm-scoped ghostty config. This file is loaded after the bundled defaults.
# Put agterm-only terminal settings here.
# Managed by Home Manager; apply with `agtermctl config reload` after edits.

# Visible selection highlight (alacritty-style), also for ssh sessions.
# Translucent so it works on light and dark themes.
selection-background-color = #4c566acc

# Disable right-click paste (Ghostty built-in option).
mouse-right-click-paste = none

# Copy-on-select, zellij-style: selected text goes straight to the clipboard.
copy-on-select = clipboard
